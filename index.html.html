<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b67"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Ôn tập 100 câu</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f6fb;color:#152033;line-height:1.5}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:20px;padding:22px;box-shadow:0 8px 30px #1720330d;margin-bottom:16px}h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px);line-height:1.15}h2{font-size:clamp(20px,4.5vw,28px);line-height:1.35}.muted{color:#667085}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{font-weight:600}button,select{font:inherit;border-radius:12px;border:1px solid #cbd5e1;padding:12px 16px;background:#fff;cursor:pointer;min-height:46px}.primary{background:#173b67!important;color:#fff;border-color:#173b67!important;font-weight:700}.opt{display:flex;width:100%;text-align:left;margin:12px 0;padding:16px 17px;border:1.5px solid #d7e0ea;border-radius:16px;background:#fff;min-height:58px;align-items:center;font-size:17px;line-height:1.45}.opt:active{transform:scale(.995)}.selected{outline:3px solid #3b82f6;border-color:#3b82f6}.correct{background:#e8f8ee!important;border-color:#43a968!important}.wrong{background:#fff0f0!important;border-color:#e35d6a!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}.navq{padding:9px 0;min-height:44px}.done{background:#e7eef8}.current{outline:3px solid #173b67}.feedback{padding:13px 15px;border-radius:12px;margin-top:12px;font-weight:700}.ok{background:#e8f8ee}.bad{background:#fff0f0}.hidden{display:none!important}.score{font-size:clamp(36px,9vw,56px);font-weight:850;color:#173b67}.bar{height:11px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar div{height:100%;background:#2563eb;transition:width .2s}.section{font-size:13px;font-weight:800;color:#667085;text-transform:uppercase;letter-spacing:.04em}.review{border-top:1px solid #eee;padding-top:16px;margin-top:16px}
@media(max-width:640px){body{background:#fff}.wrap{padding:0 0 92px}.card{border-radius:0;border-left:0;border-right:0;box-shadow:none;margin:0;padding:18px 16px}.card+ .card{border-top:8px solid #f3f6fb}#home{min-height:100vh;padding-top:28px}.row{align-items:stretch}#home .row{display:grid;grid-template-columns:1fr}#home label{display:grid;gap:6px}select{width:100%;font-size:16px}.opt{font-size:16px;padding:16px 14px;margin:10px 0}.grid{grid-template-columns:repeat(5,1fr)}#quiz>.card:first-child .row:last-child{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #dfe5ec;box-shadow:0 -6px 20px #00000010;display:grid;grid-template-columns:1fr 1fr}#quiz>.card:first-child .row:last-child button{width:100%;padding:12px 8px}#question{margin-top:14px}.primary{min-height:50px}button{touch-action:manipulation}}
</style></head><body><div class="wrap"><section id="home" class="card"><h1>Ngân hàng 100 câu hỏi trắc nghiệm</h1><p class="muted">Dùng tốt trên điện thoại • ôn tập ngẫu nhiên • tự chấm điểm • luyện lại câu sai</p><div class="row"><label>Số câu <select id="count"><option>10</option><option>20</option><option>50</option><option selected>100</option></select></label><label>Chế độ <select id="mode"><option value="practice">Luyện tập — báo đúng/sai ngay</option><option value="exam">Thi thử — chấm khi nộp</option></select></label><label><input id="shuffleOpts" type="checkbox"> Tráo A/B/C/D</label></div><p><button class="primary" onclick="startQuiz(false)">Bắt đầu ôn tập</button></p></section><section id="quiz" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><div><div id="progress" class="section"></div><div id="orig" class="muted"></div></div><button onclick="goHome()">Thoát</button></div><p><div class="bar"><div id="bar"></div></div></p><h2 id="question"></h2><div id="options"></div><div id="feedback"></div><div class="row" style="justify-content:space-between;margin-top:18px"><button onclick="move(-1)">← Câu trước</button><button class="primary" onclick="move(1)">Câu tiếp →</button></div></div><div class="card"><div class="section">Danh sách câu</div><div id="nav" class="grid" style="margin-top:12px"></div><p><button class="primary" onclick="submitQuiz()">Nộp bài & chấm điểm</button></p></div></section><section id="result" class="hidden"><div class="card"><div class="section">Kết quả</div><div id="score" class="score"></div><p id="summary"></p><div class="row"><button class="primary" onclick="startQuiz(false)">Làm đề mới</button><button id="retry" onclick="startQuiz(true)">Ôn lại câu sai</button><button onclick="goHome()">Trang chủ</button></div></div><div id="review" class="card"></div></section></div><script>const BANK=[{"id": 1, "q": "Qua kiểm tra, một đơn vị có hệ số bảo đảm trang bị nhóm SSCĐ đạt 0,95, nhóm hoạt động thường xuyên đạt 1,0. Trong điều kiện nguồn trang bị bổ sung có hạn, phương án nào cần được ưu tiên?", "opts": {"A": "Giữ nguyên vì hệ số bình quân của hai nhóm đều ở mức cao.", "B": "Ưu tiên bổ sung, đồng bộ nhóm SSCĐ để đưa Kbđ lên 1,0.", "C": "Tiếp tục bổ sung nhóm hoạt động thường xuyên để duy trì Kbđ = 1,0.", "D": "Điều chỉnh cả hai nhóm về cùng mức Kbđ = 0,95."}, "answer": "B"}, {"id": 2, "q": "Đơn vị đã hoàn thành 98% chỉ tiêu bảo đảm trang bị theo mệnh lệnh của người chỉ huy; số trang bị đã bảo đảm đều đạt chất lượng tốt. Đánh giá nào phù hợp nhất?", "opts": {"A": "Đạt yêu cầu vì chất lượng trang bị được bảo đảm.", "B": "Đạt yêu cầu nếu 2% còn lại không ảnh hưởng đến SSCĐ.", "C": "Chưa đạt yêu cầu vì phải hoàn thành có chất lượng 100% chỉ tiêu được giao.", "D": "Có thể coi là hoàn thành nếu được cơ quan kỹ thuật xác nhận."}, "answer": "C"}, {"id": 3, "q": "Một đơn vị đang thừa một số trang bị kỹ thuật, trong khi đơn vị khác cùng cấp đang thiếu trang bị cùng chủng loại phục vụ nhiệm vụ. Cách xử lý phù hợp nhất là gì?", "opts": {"A": "Hai đơn vị chủ động bàn giao trực tiếp cho nhau để kịp nhiệm vụ.", "B": "Đơn vị thừa cho đơn vị thiếu mượn, không cần thực hiện thủ tục điều chuyển.", "C": "Báo cáo, đề xuất điều chuyển và tổ chức thực hiện theo đúng phân cấp, thủ tục của chuyên ngành kỹ thuật.", "D": "Giữ nguyên trang bị tại đơn vị đang quản lý để tránh biến động biên chế."}, "answer": "C"}, {"id": 4, "q": "Trong quá trình tiếp nhận trang bị, đơn vị xác định số lượng, chủng loại và chất lượng đều đúng yêu cầu nhưng hồ sơ, lý lịch của một số trang bị chưa đầy đủ. Cách đánh giá nào đúng nhất?", "opts": {"A": "Vẫn tiếp nhận vì trang bị thực tế đã bảo đảm yêu cầu.", "B": "Tiếp nhận trước, hồ sơ có thể bổ sung khi đưa vào sử dụng.", "C": "Chưa bảo đảm đầy đủ yêu cầu quản lý; phải hoàn thiện hồ sơ và thực hiện đúng thủ tục giao nhận.", "D": "Chỉ cần lập biên bản xác nhận tình trạng trang bị để thay thế hồ sơ còn thiếu."}, "answer": "C"}, {"id": 5, "q": "Qua phúc tra, một trang bị không còn nhu cầu sử dụng tại đơn vị và dự kiến đưa ra khỏi biên chế nhưng chưa có quyết định của cấp có thẩm quyền. Đơn vị nên xử lý như thế nào?", "opts": {"A": "Chủ động xử lý để giảm số lượng trang bị tồn kho.", "B": "Tổ chức thanh lý nếu xác định trang bị không còn nhu cầu sử dụng.", "C": "Báo cáo, đề xuất và chỉ tổ chức xử lý khi có quyết định của cấp có thẩm quyền.", "D": "Chuyển sang vật tư dự phòng và không cần báo cáo cấp trên."}, "answer": "C"}, {"id": 6, "q": "Một số đạn dược cấp 5 nguy hiểm cần xử lý gấp để bảo đảm an toàn kho. Phương án nào đúng nhất?", "opts": {"A": "Đơn vị tự tổ chức tiêu hủy ngay vì yêu cầu bảo đảm an toàn là ưu tiên cao nhất.", "B": "Áp dụng quy trình xử lý vật tư kỹ thuật thông thường nhưng tăng cường lực lượng an toàn.", "C": "Xử lý theo quy định của Bộ Quốc phòng và hướng dẫn chuyên ngành kỹ thuật, đồng thời lập và lưu trữ đầy đủ hồ sơ.", "D": "Chuyển ra khỏi kho và xử lý theo kinh nghiệm của cán bộ kỹ thuật."}, "answer": "C"}, {"id": 7, "q": "Một nhóm trang bị huấn luyện chiến đấu có Kt = 0,96; tuy nhiên, trang bị được lựa chọn trực tiếp thực hiện nhiệm vụ chỉ đạt Kt = 0,97. Đánh giá nào đúng?", "opts": {"A": "Đạt yêu cầu vì toàn nhóm có Kt > 0,95.", "B": "Đạt yêu cầu vì trang bị trực tiếp làm nhiệm vụ có hệ số kỹ thuật cao hơn hệ số chung của nhóm.", "C": "Chưa đạt yêu cầu vì trang bị trực tiếp làm nhiệm vụ phải có Kt = 1,0.", "D": "Chỉ cần nâng hệ số chung của nhóm lên 1,0."}, "answer": "C"}, {"id": 8, "q": "Đơn vị nhận nhiệm vụ đột xuất, cần đưa ngay một trang bị kỹ thuật vào sử dụng. Trang bị vừa hoạt động tốt ở nhiệm vụ trước nhưng lần này chưa được kiểm tra kỹ thuật. Chỉ huy nên quyết định thế nào?", "opts": {"A": "Cho sử dụng ngay vì trang bị vừa hoạt động tốt.", "B": "Cho sử dụng nếu người vận hành xác nhận trang bị bình thường.", "C": "Phải tổ chức kiểm tra và chỉ sử dụng khi trang bị đạt yêu cầu kỹ thuật.", "D": "Cho sử dụng trước, kiểm tra bổ sung sau khi hoàn thành nhiệm vụ."}, "answer": "C"}, {"id": 9, "q": "Một đơn vị hoàn thành 100% số lượng trang bị theo kế hoạch bảo dưỡng, sửa chữa nhưng một số nội dung đã rút gọn nguyên công để bảo đảm tiến độ. Kết quả này nên được đánh giá như thế nào?", "opts": {"A": "Hoàn thành tốt vì đạt đủ 100% khối lượng và đúng thời gian.", "B": "Hoàn thành nếu sau sửa chữa trang bị vẫn hoạt động bình thường.", "C": "Chưa bảo đảm yêu cầu vì phải thực hiện đúng quy trình công nghệ và các nguyên công.", "D": "Có thể chấp nhận nếu việc rút gọn giúp tiết kiệm ngân sách."}, "answer": "C"}, {"id": 10, "q": "Một trang bị hoạt động thường xuyên có Kt = 0,92, đã được kiểm tra và đủ điều kiện sử dụng. Nhận định nào phù hợp nhất?", "opts": {"A": "Không đạt vì mọi trang bị phải có Kt = 1,0.", "B": "Đạt yêu cầu về hệ số kỹ thuật đối với nhóm hoạt động thường xuyên.", "C": "Chỉ đạt nếu nâng Kt lên tối thiểu 0,95.", "D": "Chỉ được sử dụng cho nhiệm vụ huấn luyện chiến đấu."}, "answer": "B"}, {"id": 11, "q": "Một trang bị hiện vẫn hoạt động tốt nhưng đã đến thời hạn bảo dưỡng định kỳ. Do đơn vị đang có nhiều nhiệm vụ, cán bộ kỹ thuật đề nghị tiếp tục khai thác và lùi bảo dưỡng sang kỳ sau. Phương án nào phù hợp nhất?", "opts": {"A": "Đồng ý vì tình trạng kỹ thuật hiện tại vẫn tốt.", "B": "Đồng ý nếu trang bị không làm nhiệm vụ SSCĐ.", "C": "Tổ chức bảo dưỡng đúng định kỳ, tiến độ và quy trình quy định.", "D": "Chỉ cần kiểm tra bên ngoài, nếu bình thường thì tiếp tục sử dụng."}, "answer": "C"}, {"id": 12, "q": "Đơn vị có một sáng kiến cải tiến kỹ thuật đã được công nhận nhưng chưa đưa vào ứng dụng thực tế. Khi đánh giá hiệu quả sáng kiến theo yêu cầu bảo đảm kỹ thuật, nhận định nào hợp lý nhất?", "opts": {"A": "Đã đạt yêu cầu vì sáng kiến được công nhận.", "B": "Chưa đủ cơ sở đánh giá hiệu quả vì cần được ứng dụng và tạo ra hiệu quả thực tế.", "C": "Đạt yêu cầu nếu sáng kiến có khả năng tiết kiệm ngân sách.", "D": "Đạt yêu cầu nếu sáng kiến liên quan đến trang bị công nghệ cao."}, "answer": "B"}, {"id": 13, "q": "Đơn vị bảo đảm đủ vật tư, ngân sách cho công tác kỹ thuật nhưng quá trình sử dụng còn để xảy ra lãng phí một số vật tư. Đánh giá nào đúng?", "opts": {"A": "Vẫn đạt vì đã bảo đảm đủ vật tư và ngân sách.", "B": "Đạt nếu không làm ảnh hưởng đến nhiệm vụ kỹ thuật.", "C": "Chưa đạt đầy đủ yêu cầu vì vật tư, ngân sách phải được quản lý, sử dụng hiệu quả và đúng nguyên tắc.", "D": "Chỉ cần điều chỉnh trong kỳ kế hoạch tiếp theo."}, "answer": "C"}, {"id": 14, "q": "Đơn vị có 20 thiết bị thuộc danh mục yêu cầu nghiêm ngặt về an toàn; 19 thiết bị đã đăng ký, kiểm định, còn 01 thiết bị chưa hoàn thành kiểm định nhưng đang cần sử dụng gấp. Cách xử lý phù hợp nhất?", "opts": {"A": "Cho sử dụng vì 95% thiết bị đã được kiểm định.", "B": "Cho sử dụng nếu cán bộ kỹ thuật xác nhận thiết bị hoạt động bình thường.", "C": "Không đưa thiết bị chưa hoàn thành yêu cầu đăng ký, kiểm định kỹ thuật an toàn vào sử dụng.", "D": "Cho sử dụng hạn chế và hoàn thành kiểm định sau."}, "answer": "C"}, {"id": 15, "q": "Một vụ tai nạn lao động xảy ra nhưng mức độ nhẹ, người bị nạn trở lại làm việc trong ngày. Đơn vị cho rằng không cần thống kê, báo cáo. Nhận định nào đúng?", "opts": {"A": "Phù hợp vì chỉ tai nạn nghiêm trọng mới phải báo cáo.", "B": "Phù hợp nếu người lao động không phải điều trị.", "C": "Không phù hợp; vụ việc phải được khai báo, điều tra, thống kê và báo cáo theo phân cấp.", "D": "Chỉ cần tổ chức rút kinh nghiệm nội bộ."}, "answer": "C"}, {"id": 16, "q": "Trước khi thực hiện nhiệm vụ vận chuyển, 9/10 xe đã được kiểm tra tình trạng kỹ thuật; xe còn lại vừa được bảo dưỡng và người lái khẳng định hoạt động tốt. Chỉ huy nên xử lý thế nào?", "opts": {"A": "Cho cả 10 xe thực hiện nhiệm vụ vì xe còn lại vừa được bảo dưỡng.", "B": "Chỉ cho 9 xe đã kiểm tra thực hiện nhiệm vụ; xe còn lại phải được kiểm tra đạt yêu cầu trước khi sử dụng.", "C": "Cho xe thứ 10 tham gia nếu quãng đường di chuyển ngắn.", "D": "Cho xe thứ 10 tham gia nhưng bố trí cán bộ kỹ thuật đi cùng."}, "answer": "B"}, {"id": 17, "q": "Đơn vị quản lý rất chặt phương tiện quân sự trong giờ làm việc nhưng ít kiểm tra quân nhân sử dụng phương tiện cá nhân vào giờ nghỉ, ngày nghỉ. Điểm hạn chế chính là gì?", "opts": {"A": "Chưa quản lý toàn diện hoạt động tham gia giao thông của quân nhân, nhất là trong giờ nghỉ, ngày nghỉ và đối với phương tiện cá nhân.", "B": "Chưa tăng cường kiểm định xe quân sự.", "C": "Chưa tổ chức đủ số lần huấn luyện lái xe quân sự.", "D": "Chưa ứng dụng công nghệ thông tin trong sát hạch lái xe."}, "answer": "A"}, {"id": 18, "q": "Kế hoạch huấn luyện bổ túc lái xe của đơn vị có 100 người, thực tế hoàn thành 97 người; cả 97 người đều đạt kết quả tốt. Đánh giá nào đúng?", "opts": {"A": "Hoàn thành tốt vì tỷ lệ đạt 97%.", "B": "Hoàn thành vì chất lượng huấn luyện được bảo đảm.", "C": "Chưa đạt chỉ tiêu vì yêu cầu hoàn thành 100% kế hoạch huấn luyện bổ túc lái xe.", "D": "Đạt nếu 03 người còn lại không trực tiếp thực hiện nhiệm vụ."}, "answer": "C"}, {"id": 19, "q": "Trong năm, đơn vị giảm 6% số vụ tai nạn, giảm 6% số người chết nhưng số người bị thương chỉ giảm 3%. Đánh giá nào phù hợp nhất với mục tiêu đề ra?", "opts": {"A": "Đạt vì số vụ và số người chết đều giảm 6%.", "B": "Đạt vì bình quân ba chỉ tiêu giảm 5%.", "C": "Chưa đạt đầy đủ vì mục tiêu yêu cầu giảm từ 5% đến 7% cả số vụ, số người chết và số người bị thương.", "D": "Chỉ cần xem xét thêm chỉ tiêu ki-lô-mét an toàn mới có thể đánh giá."}, "answer": "C"}, {"id": 20, "q": "Sau một vụ tai nạn giao thông có dấu hiệu vi phạm, đơn vị đã tổ chức rút kinh nghiệm nội bộ nhưng chưa phối hợp với cơ quan chức năng để xử lý. Việc cần làm tiếp theo phù hợp nhất là gì?", "opts": {"A": "Kết thúc xử lý vì đơn vị đã tổ chức rút kinh nghiệm.", "B": "Chờ người liên quan tự làm việc với cơ quan chức năng.", "C": "Phối hợp chặt chẽ với cơ quan chức năng để xác minh, xử lý kịp thời theo pháp luật Nhà nước và kỷ luật Quân đội.", "D": "Chỉ xử lý kỷ luật nội bộ nếu người vi phạm là quân nhân."}, "answer": "C"}, {"id": 21, "q": "Một đơn vị tàu đã xây dựng kế hoạch thực hiện Cuộc vận động 50 nhưng việc tổ chức thực hiện chủ yếu do cơ quan hậu cần - kỹ thuật đảm nhiệm, các bộ phận khác tham gia chưa đầy đủ. Biện pháp nào phù hợp nhất?", "opts": {"A": "Tiếp tục giao cơ quan hậu cần - kỹ thuật chủ trì toàn bộ vì đây là nội dung chuyên ngành.", "B": "Phát huy vai trò lãnh đạo, chỉ đạo của cấp ủy, người chỉ huy và tổ chức cho các lực lượng trong đơn vị tàu cùng tham gia thực hiện.", "C": "Chỉ cần tăng cường kiểm tra đối với cơ quan hậu cần - kỹ thuật.", "D": "Chờ sơ kết cuối năm để đánh giá mức độ tham gia của các bộ phận."}, "answer": "B"}, {"id": 22, "q": "Qua kiểm tra, một đơn vị tàu quản lý đủ số lượng VKTBKT nhưng một số trang bị chưa bảo đảm đồng bộ, có hư hỏng nhỏ chưa được phát hiện và khắc phục kịp thời. Biện pháp nào cần ưu tiên thực hiện?", "opts": {"A": "Tiếp tục bổ sung thêm số lượng VKTBKT để tăng khả năng dự phòng.", "B": "Tăng cường kiểm tra, quản lý chặt chẽ số lượng, chất lượng, chủng loại, đồng bộ và kịp thời khắc phục các hư hỏng của VKTBKT.", "C": "Chỉ tập trung sửa chữa những trang bị trực tiếp làm nhiệm vụ sẵn sàng chiến đấu.", "D": "Đưa các trang bị có hư hỏng vào niêm cất và chờ kế hoạch sửa chữa của cấp trên."}, "answer": "B"}, {"id": 23, "q": "Một đơn vị tàu được biên chế VKTBKT mới, hiện đại. Cán bộ, nhân viên đã được huấn luyện lý thuyết nhưng kỹ năng khai thác, sử dụng thực tế còn hạn chế. Biện pháp nào phù hợp nhất với yêu cầu thực hiện Cuộc vận động 50?", "opts": {"A": "Chỉ giao cho cán bộ có nhiều kinh nghiệm trực tiếp khai thác trang bị.", "B": "Hạn chế đưa trang bị vào hoạt động để tránh phát sinh hư hỏng trong quá trình sử dụng.", "C": "Tăng cường huấn luyện thực hành, từng bước nâng cao trình độ khai thác, sử dụng và làm chủ VKTBKT mới, hiện đại.", "D": "Chờ cán bộ kỹ thuật cấp trên trực tiếp hướng dẫn mới tổ chức khai thác trang bị."}, "answer": "C"}, {"id": 24, "q": "Một VKTBKT trên đơn vị tàu vẫn hoạt động bình thường nhưng đã đến thời hạn bảo dưỡng định kỳ. Do đơn vị đang thực hiện nhiều nhiệm vụ, cán bộ kỹ thuật đề nghị lùi thời gian bảo dưỡng sang kỳ sau. Cách xử lý nào phù hợp nhất?", "opts": {"A": "Đồng ý vì trang bị hiện vẫn hoạt động bình thường.", "B": "Tiếp tục khai thác và chỉ tổ chức bảo dưỡng khi xuất hiện dấu hiệu hư hỏng.", "C": "Tổ chức bảo dưỡng đúng chế độ, định kỳ và quy trình quy định, đồng thời bố trí nhiệm vụ phù hợp để không ảnh hưởng đến khả năng thực hiện nhiệm vụ của tàu.", "D": "Chỉ tổ chức kiểm tra bên ngoài; nếu không phát hiện bất thường thì tiếp tục khai thác."}, "answer": "C"}, {"id": 25, "q": "Trong quá trình huấn luyện có sử dụng VKTBKT, một đơn vị tàu hoàn thành tốt nội dung, chỉ tiêu đề ra nhưng một số khâu chưa thực hiện đầy đủ quy trình bảo đảm an toàn và thực tế không xảy ra sự cố. Đánh giá nào phù hợp nhất?", "opts": {"A": "Đạt yêu cầu vì quá trình huấn luyện không xảy ra mất an toàn.", "B": "Đạt yêu cầu vì đơn vị đã hoàn thành đầy đủ nội dung, chỉ tiêu huấn luyện.", "C": "Chưa bảo đảm yêu cầu vì khai thác, sử dụng VKTBKT phải đồng thời chấp hành nghiêm quy trình, quy định và các biện pháp bảo đảm an toàn.", "D": "Có thể chấp nhận vì những khâu chưa thực hiện đầy đủ không gây hư hỏng VKTBKT."}, "answer": "C"}, {"id": 26, "q": "Qua kiểm tra một đơn vị tàu, toàn bộ VKTBKT đều có đủ sổ sách quản lý và được thống kê đúng số lượng. Tuy nhiên, một số trang bị thiếu phụ tùng đồng bộ, chất lượng không ổn định và hồ sơ kỹ thuật chưa được cập nhật kịp thời. Nếu đánh giá theo mục tiêu “Quản lý tốt” của Cuộc vận động 50, nhận định nào phù hợp nhất?", "opts": {"A": "Đạt yêu cầu vì đơn vị đã quản lý chính xác số lượng VKTBKT.", "B": "Cơ bản đạt yêu cầu vì thiếu đồng bộ không thuộc nội dung quản lý kỹ thuật.", "C": "Chưa đạt đầy đủ yêu cầu vì quản lý tốt phải nắm chắc số lượng, chất lượng, sự đồng bộ của VKTBKT và các yếu tố bảo đảm có liên quan.", "D": "Chỉ cần bổ sung hồ sơ kỹ thuật, không cần xem xét tình trạng đồng bộ của trang bị."}, "answer": "C"}, {"id": 27, "q": "Một đơn vị tàu được trang bị hệ thống kỹ thuật mới, hiện đại. Để hạn chế hư hỏng, chỉ huy quyết định chỉ giao cho một số ít nhân viên có kinh nghiệm khai thác; các nhân viên còn lại chủ yếu học lý thuyết và chưa được thực hành trên trang bị. Xét theo mục tiêu “Khai thác VKTBKT tốt, bền”, giải pháp nào phù hợp nhất?", "opts": {"A": "Tiếp tục hạn chế số người khai thác để giảm nguy cơ hư hỏng trang bị.", "B": "Chỉ sử dụng trang bị khi thực hiện nhiệm vụ quan trọng, không tổ chức huấn luyện thực hành.", "C": "Tổ chức huấn luyện, bồi dưỡng và thực hành có kiểm soát để cán bộ, nhân viên từng bước khai thác, làm chủ trang bị; đồng thời duy trì nghiêm chế độ bảo quản, bảo dưỡng, sửa chữa.", "D": "Giao hoàn toàn việc khai thác, sửa chữa cho chuyên gia hoặc nhà sản xuất."}, "answer": "C"}, {"id": 28, "q": "Trong thực hiện ngày kỹ thuật, một VKTBKT vẫn hoạt động bình thường nhưng đã đến thời hạn bảo dưỡng định kỳ. Do đơn vị chuẩn bị thực hiện nhiệm vụ, có ý kiến đề nghị tiếp tục khai thác và chỉ bảo dưỡng khi xuất hiện dấu hiệu bất thường. Theo mục tiêu “Khai thác VKTBKT tốt, bền”, phương án nào đúng nhất?", "opts": {"A": "Tiếp tục khai thác vì trang bị chưa xuất hiện hư hỏng.", "B": "Chỉ kiểm tra bên ngoài; nếu không có bất thường thì được phép bỏ kỳ bảo dưỡng.", "C": "Tổ chức bảo dưỡng theo đúng chế độ, quy trình; đồng thời bố trí kế hoạch hợp lý để vừa duy trì tình trạng kỹ thuật tốt của VKTBKT, vừa bảo đảm thực hiện nhiệm vụ.", "D": "Chờ đến lần sửa chữa tiếp theo để kết hợp thực hiện bảo dưỡng."}, "answer": "C"}, {"id": 29, "q": "Một đơn vị tàu hoàn thành đầy đủ nhiệm vụ huấn luyện, VKTBKT không xảy ra hư hỏng; tuy nhiên, trong quá trình khai thác có một số thời điểm cán bộ, nhân viên bỏ qua một bước trong quy trình an toàn vì cho rằng thao tác này không cần thiết trong điều kiện thực tế. Theo mục tiêu “Bảo đảm an toàn VKTBKT và an toàn giao thông”, đánh giá nào phù hợp nhất?", "opts": {"A": "Đạt yêu cầu vì không xảy ra tai nạn hoặc hư hỏng VKTBKT.", "B": "Có thể chấp nhận nếu người khai thác có nhiều kinh nghiệm.", "C": "Chưa đạt yêu cầu; bảo đảm an toàn phải duy trì nghiêm quy định, quy trình và chủ động phòng ngừa nguy cơ, không thể lấy kết quả “chưa xảy ra sự cố” thay cho việc chấp hành quy định.", "D": "Chỉ cần rút kinh nghiệm nếu hành vi đó dẫn đến mất an toàn thực tế."}, "answer": "C"}, {"id": 30, "q": "Một đơn vị đề xuất hai phương án bảo đảm kỹ thuật cho VKTBKT: phương án thứ nhất thay mới toàn bộ một cụm thiết bị còn khả năng sửa chữa; phương án thứ hai kiểm tra, phục hồi các chi tiết còn đủ tiêu chuẩn, tận dụng vật tư phù hợp và áp dụng sáng kiến kỹ thuật đã được đánh giá bảo đảm an toàn, chất lượng. Theo mục tiêu “Thực hành tiết kiệm”, phương án nào hợp lý nhất?", "opts": {"A": "Luôn lựa chọn thay mới toàn bộ vì trang bị mới có độ tin cậy cao hơn.", "B": "Ưu tiên phương án thứ hai nếu vẫn bảo đảm yêu cầu kỹ thuật, an toàn và hiệu quả; qua đó tiết kiệm vật tư, kinh phí và phát huy sáng kiến cải tiến kỹ thuật.", "C": "Lựa chọn phương án có chi phí thấp nhất, không cần xem xét chất lượng kỹ thuật sau sửa chữa.", "D": "Tận dụng tối đa mọi vật tư cũ, kể cả vật tư không còn bảo đảm tiêu chuẩn kỹ thuật."}, "answer": "B"}, {"id": 31, "q": "Khi kiểm tra nền nếp chính quy tàu, phát hiện cọc bích, bệ tời neo và xích neo được sơn màu trắng để đồng bộ với khu vực mặt boong. Theo quy định, các chi tiết này phải được sơn màu nào?", "opts": {"A": "Màu trắng.", "B": "Màu cùng với mặt boong.", "C": "Màu đen.", "D": "Màu ghi xám."}, "answer": "C"}, {"id": 32, "q": "Trong quá trình củng cố nền nếp chính quy, đơn vị tiến hành sơn lại tay van khóa đánh chìm. Màu sơn nào sau đây đúng quy định?", "opts": {"A": "Màu đỏ.", "B": "Màu đen.", "C": "Màu xanh lá cây.", "D": "Màu vàng."}, "answer": "C"}, {"id": 33, "q": "Một tàu tiến hành sơn lại giá bình cứu hỏa, giá dụng cụ chống chìm, giá phao bè cứng và giá phao tròn cá nhân. Phương án màu sơn nào sau đây đúng quy định?", "opts": {"A": "Màu đỏ RAL 3026.", "B": "Màu đỏ cờ.", "C": "Màu cam.", "D": "Màu trắng."}, "answer": "A"}, {"id": 34, "q": "Đối với tàu có đường mớn nước thấp hơn so với sạp chính, việc phân chia màu sơn trong khoang, hầm được thực hiện như thế nào?", "opts": {"A": "Dưới đường mớn nước sơn màu vàng kem; trên đường mớn nước sơn màu xanh lá cây.", "B": "Dưới đường mớn nước sơn màu xanh lá cây; trên đường mớn nước sơn màu vàng kem nhạt RAL 1015.", "C": "Toàn bộ khoang, hầm sơn màu xanh lá cây.", "D": "Toàn bộ khoang, hầm sơn màu vàng kem nhạt RAL 1015."}, "answer": "B"}, {"id": 35, "q": "Khi sơn sào chống trên tàu, phương án nào sau đây đúng quy định?", "opts": {"A": "Sơn xen kẽ đỏ - trắng, mỗi đoạn dài 400 mm, bắt đầu bằng màu đỏ từ đầu to của sào chống.", "B": "Sơn xen kẽ trắng - đỏ, mỗi đoạn dài 400 mm, bắt đầu bằng màu trắng từ đầu to của sào chống.", "C": "Sơn xen kẽ đỏ - trắng, mỗi đoạn dài 500 mm, bắt đầu bằng màu đỏ từ đầu nhỏ của sào chống.", "D": "Sơn toàn bộ màu đỏ, riêng hai đầu sơn màu trắng."}, "answer": "A"}, {"id": 36, "q": "Trong quá trình kiểm tra trạng thái đóng, mở các cửa trên tàu Cảnh sát biển, phát hiện một cửa mang ký hiệu chữ K. Theo Điều lệnh tàu Cảnh sát biển năm 2018, cửa này được quản lý như thế nào?", "opts": {"A": "Chỉ đóng lại khi có lệnh.", "B": "Đóng lại khi có báo động.", "C": "Chỉ mở khi có lệnh.", "D": "Thường xuyên đóng kín."}, "answer": "D"}, {"id": 37, "q": "Khi đánh giá khả năng bảo đảm sức sống của tàu, yếu tố nào sau đây phản ánh đầy đủ nhất cơ sở hình thành sức sống tàu?", "opts": {"A": "Kết cấu thân vỏ và việc thực hiện hằng ngày toàn bộ các biện pháp tổ chức kỹ thuật của cán bộ, chiến sĩ trên tàu.", "B": "Chỉ phụ thuộc vào kết cấu thân vỏ tàu.", "C": "Chỉ phụ thuộc vào các biện pháp tổ chức kỹ thuật của cán bộ, chiến sĩ.", "D": "Chủ yếu phụ thuộc vào công tác bảo quản, bảo dưỡng, sửa chữa định kỳ thân vỏ tàu."}, "answer": "A"}, {"id": 38, "q": "Khi xây dựng phương án đấu tranh bảo vệ sức sống tàu, cần xác định đầy đủ các yếu tố cơ bản cấu thành sức sống tàu. Phương án nào sau đây là đầy đủ nhất?", "opts": {"A": "Tính chống chìm và tính phòng, chống cháy, nổ.", "B": "Bảo đảm sức sống cho vũ khí và trang bị kỹ thuật.", "C": "Tính chống chìm; tính phòng, chống cháy, nổ; bảo đảm sức sống cho vũ khí và trang bị kỹ thuật.", "D": "Tính chống chìm và bảo đảm sức sống cho vũ khí, trang bị kỹ thuật."}, "answer": "C"}, {"id": 39, "q": "Trong tổ chức đấu tranh bảo vệ sức sống tàu, nội dung nào sau đây phản ánh đầy đủ các mặt công tác phải tiến hành?", "opts": {"A": "Chống chìm cho tàu; chống cháy và phòng nổ; bảo đảm sức sống cho vũ khí, trang bị kỹ thuật; chống các chất độc, chất phóng xạ và vũ khí vi trùng.", "B": "Chống chìm; chống cháy và phòng nổ; bảo đảm sức sống cho vũ khí, trang bị kỹ thuật.", "C": "Chống cháy và phòng nổ; bảo đảm sức sống cho vũ khí, trang bị kỹ thuật; chống các chất độc, chất phóng xạ và vũ khí vi trùng.", "D": "Chống chìm; bảo đảm sức sống cho vũ khí, trang bị kỹ thuật; chống các chất độc, chất phóng xạ và vũ khí vi trùng."}, "answer": "A"}, {"id": 40, "q": "Khi đánh giá khả năng chống chìm của một tàu, cần xem xét đồng thời những yếu tố nào?", "opts": {"A": "Kết cấu của tàu và các biện pháp tổ chức kỹ thuật.", "B": "Hoạt động của toàn thể cán bộ, chiến sĩ trên tàu trong đấu tranh chống chìm.", "C": "Kết cấu của tàu; các biện pháp tổ chức kỹ thuật; hoạt động của toàn thể cán bộ, chiến sĩ trên tàu trong đấu tranh chống chìm.", "D": "Kết cấu của tàu và hoạt động của cán bộ, chiến sĩ trong đấu tranh chống chìm."}, "answer": "C"}, {"id": 41, "q": "Một đám cháy xảy ra do nhiên liệu lỏng hoặc chất lỏng dễ bén lửa. Khi lựa chọn bình bọt hóa học OP-M để xử trí, nhận định nào sau đây đúng?", "opts": {"A": "Bình OP-M sử dụng được cho tất cả các loại đám cháy.", "B": "Dùng cho nhiên liệu lỏng, chất lỏng dễ bén lửa và cháy điện.", "C": "Dùng cho nhiên liệu lỏng, chất lỏng dễ bén lửa, cháy điện và vật khô.", "D": "Dùng cho các loại nhiên liệu lỏng và chất lỏng dễ bén lửa."}, "answer": "D"}, {"id": 42, "q": "Khi xảy ra cháy đối với vật liệu không cần ôxy trong không khí để duy trì quá trình cháy như đạn dược, bom, mìn, theo tài liệu cần sử dụng phương tiện chứa chất dập cháy nào?", "opts": {"A": "Nước.", "B": "Chất lỏng dập cháy dễ bay hơi hoặc khí CO₂.", "C": "Bọt hóa học hoặc bọt cơ học.", "D": "Tất cả các phương án trên."}, "answer": "A"}, {"id": 43, "q": "Khi xảy ra cháy dầu, mỡ hoặc nhiên liệu trên tàu, phương tiện chứa chất dập cháy nào sau đây phù hợp theo tài liệu?", "opts": {"A": "Chất lỏng dập cháy dễ bay hơi, khí CO₂, bọt hóa học, bọt cơ học.", "B": "Nước, khí CO₂, bọt hóa học, bọt cơ học.", "C": "Chất lỏng dập cháy dễ bay hơi, nước, bọt cơ học, bọt hóa học.", "D": "Chỉ sử dụng nước."}, "answer": "A"}, {"id": 44, "q": "Một thiết bị điện đang có dòng điện chạy qua phát sinh cháy. Theo tài liệu, phương tiện chứa chất dập cháy nào sau đây được sử dụng?", "opts": {"A": "Bọt cơ khí hòa bằng nước ngọt và khí CO₂.", "B": "Chất lỏng dập cháy dễ bay hơi, khí CO₂, bọt hóa học.", "C": "Chất lỏng dập cháy dễ bay hơi, nước, bọt cơ học, bọt hóa học.", "D": "Chỉ sử dụng khí CO₂."}, "answer": "B"}, {"id": 45, "q": "Khi xảy ra cháy các vật rắn như gỗ, giấy, giẻ, quần áo và các chất rắn khác, phương án chất dập cháy nào sau đây đầy đủ nhất?", "opts": {"A": "Nước; chất lỏng dập cháy dễ bay hơi; khí CO₂; bọt hóa học; bọt cơ học.", "B": "Nước và chất lỏng dập cháy dễ bay hơi.", "C": "Khí CO₂; bọt hóa học; bọt cơ học.", "D": "Chất lỏng dập cháy dễ bay hơi; khí CO₂; bọt hóa học; bọt cơ học."}, "answer": "A"}, {"id": 46, "q": "Khi phân loại các chất dập cháy phục vụ công tác phòng, chống cháy trên tàu, phương án nào sau đây đầy đủ nhất?", "opts": {"A": "Nước; bọt hóa học; bọt khí - cơ; bột cơ học.", "B": "Nước; bọt hóa học; bọt khí - cơ; bột cơ học; các chất làm loãng quán tính như CO₂, nitơ, hơi nước; các chất hãm hóa học phản ứng cháy.", "C": "Các chất làm loãng quán tính và các chất hãm hóa học phản ứng cháy.", "D": "Nước; bọt khí - cơ; bột cơ học."}, "answer": "B"}, {"id": 47, "q": "Khi tàu đang hành trình và sử dụng thiết bị cẩu để làm việc với hàng rời, tải làm việc không được vượt quá bao nhiêu phần trăm sức nâng cho phép?", "opts": {"A": "75%.", "B": "85%.", "C": "80%.", "D": "90%."}, "answer": "C"}, {"id": 48, "q": "Một bè cứu sinh có khối lượng lớn hơn 180 kg được bố trí trên boong hở hoặc thượng tầng tàu. Khoảng cách từ bè cứu sinh đến mép mạn tàu không được lớn hơn bao nhiêu?", "opts": {"A": "2 m.", "B": "3 m.", "C": "4 m.", "D": "4,5 m."}, "answer": "C"}, {"id": 49, "q": "Sau khi tàu được đưa vào nhà máy sửa chữa, trách nhiệm của CTV trong bảo đảm tính ổn định, chống cháy, chống chìm và an toàn tàu được thực hiện như thế nào?", "opts": {"A": "Phối hợp với đại diện nhà máy bảo đảm tính ổn định, chống cháy, chống chìm và an toàn tàu.", "B": "Bàn giao hoàn toàn trách nhiệm bảo đảm an toàn cho nhà máy.", "C": "Chỉ theo dõi việc nhà máy thực hiện công tác bảo đảm an toàn.", "D": "Tự tổ chức phương án bảo đảm an toàn độc lập với nhà máy."}, "answer": "A"}, {"id": 50, "q": "Trong quá trình kiểm tra các cửa trên tàu Cảnh sát biển, một cửa mang ký hiệu chữ H. Theo Điều lệnh tàu Cảnh sát biển năm 2018, cửa này được mở trong trường hợp nào?", "opts": {"A": "Theo lệnh của trưởng ngành để nhận, trả đạn; cho thủy thủ vào tiếp đạn khi có báo động chiến đấu; thông gió làm mát; khi bàn giao ca trực hằng ngày.", "B": "Chỉ để nhận, trả đạn và tiếp đạn khi có báo động chiến đấu.", "C": "Để nhận, trả đạn; tiếp đạn khi có báo động chiến đấu và thông gió làm mát.", "D": "Để nhận, trả đạn; tiếp đạn; thông gió làm mát và kiểm đếm đạn khi bàn giao ca trực."}, "answer": "A"}, {"id": 51, "q": "Khi xảy ra tình huống chống chìm hoặc chống cháy trên tàu, ai là người trực tiếp chỉ đạo, tổ chức thực hiện công tác này?", "opts": {"A": "Thuyền trưởng.", "B": "Thuyền phó quân sự.", "C": "Trưởng ngành cơ điện.", "D": "Thuyền trưởng hoặc Thuyền phó quân sự."}, "answer": "B"}, {"id": 52, "q": "Trong quá trình kiểm tra hệ thống neo, cần xác định chiều dài tiêu chuẩn của một “tiết xích neo”. Theo tài liệu, mỗi tiết xích neo dài bao nhiêu?", "opts": {"A": "23,5 m.", "B": "25,5 m.", "C": "27,5 m.", "D": "29,5 m."}, "answer": "C"}, {"id": 53, "q": "Khi tổ chức đấu tranh bảo vệ sức sống tàu, toàn thể cán bộ, chiến sĩ các ngành phải chấp hành vô điều kiện mệnh lệnh của những người nào?", "opts": {"A": "Thuyền trưởng và Trưởng ngành cơ điện.", "B": "Thuyền trưởng và Thuyền phó quân sự.", "C": "Thuyền phó quân sự và Trưởng ngành cơ điện.", "D": "Thuyền trưởng và Chính trị viên tàu."}, "answer": "B"}, {"id": 54, "q": "Khi kiểm tra điều kiện bảo quản bình chữa cháy bằng bột MFZ, khoảng nhiệt độ bảo quản nào sau đây phù hợp theo tài liệu?", "opts": {"A": "Từ -10°C đến 55°C.", "B": "Từ 0°C đến 55°C.", "C": "Từ -15°C đến 55°C.", "D": "Từ -20°C đến 55°C."}, "answer": "A"}, {"id": 55, "q": "Một bình chữa cháy bằng bột MFZ được bố trí tại vị trí có nhiệt độ và bức xạ nhiệt tương đối cao. Điều kiện bảo quản nào sau đây phù hợp?", "opts": {"A": "Nơi khô ráo, thoáng gió, tránh ánh nắng và bức xạ nhiệt mạnh; nhiệt độ cao nhất 50°C.", "B": "Nơi khô ráo, thoáng gió; nhiệt độ cao nhất 70°C.", "C": "Nơi khô ráo, tránh ánh nắng; nhiệt độ cao nhất 40°C.", "D": "Nơi khô ráo, thoáng gió; nhiệt độ cao nhất 55°C."}, "answer": "A"}, {"id": 56, "q": "Khi lập kế hoạch kiểm tra kỹ thuật bình chữa cháy bằng bột MFZ, yêu cầu kiểm tra thủy lực nào sau đây đúng theo tài liệu?", "opts": {"A": "Trước mỗi lần nạp khí mới và sau 5 năm sử dụng; áp lực kiểm tra tối thiểu 30 MPa.", "B": "Trước mỗi lần nạp khí mới và sau 3 năm sử dụng; áp lực kiểm tra tối thiểu 20 MPa.", "C": "Trước mỗi lần nạp khí mới và sau 2 năm sử dụng; áp lực kiểm tra tối thiểu 10 MPa.", "D": "Trước mỗi lần nạp khí mới và sau 6 năm sử dụng; áp lực kiểm tra tối thiểu 40 MPa."}, "answer": "A"}, {"id": 57, "q": "Khi củng cố chính quy phương tiện chống chìm dưới tàu, cột chống chìm bằng gỗ phải được sơn theo phương án nào?", "opts": {"A": "Cột màu đỏ, số thứ tự vị trí chiến đấu màu trắng.", "B": "Cột màu xanh nhạt, số thứ tự vị trí chiến đấu màu trắng.", "C": "Cột màu vàng kem, số thứ tự vị trí chiến đấu màu trắng.", "D": "Cột màu xanh nhạt, số thứ tự vị trí chiến đấu màu vàng."}, "answer": "B"}, {"id": 58, "q": "Đối với cột chống chìm bằng thép có thể thay đổi độ dài, tức kích chống chìm, phương án màu sơn nào đúng quy định?", "opts": {"A": "Màu đỏ, số thứ tự vị trí chiến đấu sơn màu trắng.", "B": "Màu xanh nhạt, số thứ tự vị trí chiến đấu sơn màu trắng.", "C": "Màu vàng kem, số thứ tự vị trí chiến đấu sơn màu trắng.", "D": "Màu xanh nước biển, số thứ tự vị trí chiến đấu sơn màu vàng."}, "answer": "A"}, {"id": 59, "q": "Khi sử dụng vòi rồng nước biển để dập cháy, trình tự thao tác nào sau đây phù hợp nhất?", "opts": {"A": "Rải ống, nối vào nguồn nước; cầm chắc đầu vòi phun và hướng vào đám cháy; sau đó mở van nước.", "B": "Rải ống, nối nguồn nước; mở van trước rồi mới cầm đầu phun.", "C": "Hướng đầu phun vào đám cháy, mở van rồi mới triển khai ống.", "D": "Nối nguồn và mở van ngay, sau đó mới triển khai ống."}, "answer": "A"}, {"id": 60, "q": "Khi kiểm tra ký hiệu nhận biết các đường ống trên tàu, đường ống dập lửa bằng nước được phân biệt bằng ký hiệu nào?", "opts": {"A": "2 vạch màu đỏ.", "B": "1 vạch màu đỏ và 1 vạch màu nâu.", "C": "1 vạch màu đỏ.", "D": "1 vạch màu đỏ và 1 vạch màu xanh lá cây."}, "answer": "C"}, {"id": 61, "q": "Một đơn vị được trang bị một số TBKT mới, hiện đại nhưng cán bộ, nhân viên kỹ thuật chưa khai thác, làm chủ vững chắc. Biện pháp nào sau đây phù hợp nhất với yêu cầu nâng cao chất lượng công tác kỹ thuật?", "opts": {"A": "Hạn chế khai thác TBKT mới để tránh phát sinh hư hỏng.", "B": "Chủ yếu dựa vào chuyên gia của nhà sản xuất trong quá trình khai thác.", "C": "Tăng cường huấn luyện, đào tạo, bồi dưỡng để từng bước khai thác, làm chủ và bảo đảm kỹ thuật cho TBKT mới.", "D": "Chỉ tổ chức huấn luyện khi TBKT phát sinh hư hỏng."}, "answer": "C"}, {"id": 62, "q": "Qua kiểm tra, một số TBKT của đơn vị vẫn hoạt động nhưng đã quá cũ, lạc hậu, không còn nguồn vật tư thay thế và sử dụng không hiệu quả. Hướng xử lý nào phù hợp nhất?", "opts": {"A": "Tiếp tục sử dụng đến khi TBKT hư hỏng hoàn toàn.", "B": "Tăng cường sửa chữa để giữ lại toàn bộ số TBKT hiện có.", "C": "Rà soát và kiên quyết loại khỏi biên chế những TBKT quá cũ, quá lạc hậu, không còn nguồn vật tư thay thế, sử dụng không hiệu quả.", "D": "Đưa toàn bộ TBKT vào niêm cất dự trữ."}, "answer": "C"}, {"id": 63, "q": "Một đơn vị duy trì đủ số lượng TBKT làm nhiệm vụ sẵn sàng chiến đấu nhưng một số trang bị có chất lượng không ổn định, thiếu đồng bộ. Để đáp ứng mục tiêu công tác kỹ thuật đến năm 2030, đơn vị cần ưu tiên nội dung nào?", "opts": {"A": "Chỉ bổ sung thêm số lượng TBKT.", "B": "Giữ gìn, khai thác, sử dụng tốt TBKT, nâng cao và duy trì hệ số kỹ thuật của TBKT làm nhiệm vụ SSCĐ luôn bằng 1, độ tin cậy cao.", "C": "Giảm sử dụng TBKT để hạn chế hư hỏng.", "D": "Chỉ tập trung sửa chữa khi TBKT không còn hoạt động."}, "answer": "B"}, {"id": 64, "q": "Qua kiểm tra ngày kỹ thuật, phát hiện một số quân nhân chưa thực hiện đúng quy trình khai thác TBKT, có nguy cơ gây hư hỏng do lỗi người sử dụng. Cách xử lý nào phù hợp nhất?", "opts": {"A": "Giao hoàn toàn cho nhân viên kỹ thuật khắc phục.", "B": "Tạm dừng ngày kỹ thuật để tập trung sửa chữa trang bị.", "C": "Tổ chức hướng dẫn, huấn luyện lại quy trình khai thác; duy trì nghiêm chế độ ngày, giờ kỹ thuật và nâng cao trách nhiệm của người sử dụng.", "D": "Chỉ xử lý khi đã xảy ra hư hỏng TBKT."}, "answer": "C"}, {"id": 65, "q": "Đơn vị chuẩn bị mua sắm một loại TBKT mới. Phương án nào phù hợp nhất với yêu cầu bảo đảm kỹ thuật lâu dài?", "opts": {"A": "Chỉ quan tâm đến tính năng kỹ thuật của trang bị.", "B": "Ưu tiên mua trang bị hiện đại nhất, không cần xem xét khả năng bảo đảm kỹ thuật.", "C": "Lựa chọn trang bị phù hợp điều kiện tác chiến, khả năng khai thác, sử dụng và bảo đảm kỹ thuật; bảo đảm đồng bộ và có vật tư kỹ thuật kèm theo.", "D": "Mua trang bị trước, sau đó mới xây dựng phương án bảo đảm kỹ thuật."}, "answer": "C"}, {"id": 66, "q": "Khi trong đơn vị xuất hiện nhiều quân nhân có biểu hiện sức khỏe bất thường giống nhau, cách xử lý nào phù hợp nhất?", "opts": {"A": "Tiếp tục huấn luyện và theo dõi thêm.", "B": "Cho từng quân nhân tự theo dõi sức khỏe.", "C": "Báo cáo chỉ huy, thông báo quân y để kiểm tra, xử trí và triển khai biện pháp phòng ngừa kịp thời.", "D": "Chỉ báo cáo khi có quân nhân phải điều trị tại bệnh viện."}, "answer": "C"}, {"id": 67, "q": "Qua kiểm tra khu nhà ở, phát hiện một số vòi nước bị rò rỉ và đèn vẫn bật khi không sử dụng. Cách xử lý nào phù hợp nhất?", "opts": {"A": "Tiếp tục sử dụng vì lượng điện, nước thất thoát không lớn.", "B": "Khắc phục kịp thời chỗ rò rỉ, tắt thiết bị khi không sử dụng và nâng cao ý thức tiết kiệm điện, nước.", "C": "Chỉ sửa chữa khi hệ thống không còn sử dụng được.", "D": "Hạn chế cấp nước và điện cho khu nhà ở."}, "answer": "B"}, {"id": 68, "q": "Khi phát hiện có xăng dầu rò rỉ tại khu vực phương tiện đang hoạt động, quân nhân cần xử trí như thế nào?", "opts": {"A": "Tiếp tục sử dụng phương tiện nếu lượng rò rỉ ít.", "B": "Tự sửa chữa ngay dù không có chuyên môn.", "C": "Kịp thời báo cáo, thực hiện biện pháp bảo đảm an toàn và xử lý theo đúng quy định.", "D": "Chờ đến ngày kỹ thuật mới báo cáo."}, "answer": "C"}, {"id": 69, "q": "Một đơn vị sử dụng xăng dầu đúng hạn mức nhưng phương tiện thường xuyên nổ máy chờ trong thời gian dài khi không thực hiện nhiệm vụ. Đánh giá nào phù hợp nhất?", "opts": {"A": "Đúng vì chưa vượt hạn mức xăng dầu.", "B": "Đúng nếu phương tiện vẫn hoạt động tốt.", "C": "Chưa hợp lý vì sử dụng xăng dầu phải gắn với yêu cầu tiết kiệm, hiệu quả và hạn chế tiêu hao không cần thiết.", "D": "Chỉ cần điều chỉnh khi đơn vị thiếu xăng dầu."}, "answer": "C"}, {"id": 70, "q": "Đơn vị đồng thời thực hiện nhiệm vụ thường xuyên và chuẩn bị cho nhiệm vụ sẵn sàng chiến đấu. Phương án bảo đảm hậu cần nào phù hợp nhất?", "opts": {"A": "Ưu tiên toàn bộ vật chất cho nhiệm vụ thường xuyên.", "B": "Sử dụng vật chất dự trữ sẵn sàng chiến đấu để thuận tiện cho nhiệm vụ thường xuyên.", "C": "Chỉ chuẩn bị vật chất khi có lệnh thực hiện nhiệm vụ.", "D": "Bảo đảm đầy đủ cho nhiệm vụ thường xuyên, đồng thời duy trì đúng quy định lượng vật chất dự trữ cho sẵn sàng chiến đấu và nhiệm vụ đột xuất."}, "answer": "D"}, {"id": 71, "q": "Qua kiểm tra một đơn vị, phong trào thi đua “Ngành Hậu cần Quân đội làm theo lời Bác Hồ dạy” đã được triển khai nhưng nội dung chủ yếu dừng ở phát động, tuyên truyền, chưa gắn chặt với nhiệm vụ bảo đảm hậu cần và các phong trào thi đua khác. Biện pháp nào phù hợp nhất để nâng cao hiệu quả phong trào?", "opts": {"A": "Tiếp tục tăng số lượng khẩu hiệu, pa-nô, áp-phích tuyên truyền trong đơn vị.", "B": "Gắn mục tiêu, nội dung phong trào với phong trào Thi đua Quyết thắng, các cuộc vận động và nhiệm vụ bảo đảm hậu cần của đơn vị; cụ thể hóa thành chỉ tiêu, nội dung phù hợp.", "C": "Giao riêng cơ quan hậu cần tổ chức thực hiện để bảo đảm tính chuyên môn.", "D": "Chỉ tập trung sơ kết, khen thưởng các tập thể, cá nhân tiêu biểu cuối năm."}, "answer": "B"}, {"id": 72, "q": "Một đơn vị triển khai phong trào thi đua nhưng cán bộ, chiến sĩ tham gia chưa tích cực, Ban Chỉ đạo hoạt động chưa thường xuyên, cơ quan hậu cần tham mưu chưa chủ động. Theo tài liệu, giải pháp nào cần được ưu tiên?", "opts": {"A": "Chỉ tăng cường kiểm tra đột xuất các bộ phận hậu cần.", "B": "Củng cố, kiện toàn Ban Chỉ đạo; phát huy vai trò tham mưu của cơ quan hậu cần; đề cao trách nhiệm của cấp ủy, chỉ huy và huy động mọi cán bộ, chiến sĩ tham gia.", "C": "Chuyển toàn bộ trách nhiệm tổ chức phong trào cho cơ quan chính trị.", "D": "Chờ đến cuối năm đánh giá, sau đó mới điều chỉnh phương pháp tổ chức."}, "answer": "B"}, {"id": 73, "q": "Một đơn vị có kết quả bảo đảm hậu cần tốt nhưng nội dung thi đua còn chung chung, chưa sát đặc điểm nhiệm vụ, các chỉ tiêu chưa cụ thể nên khó kiểm tra, đánh giá. Cách xử lý nào phù hợp nhất với yêu cầu tiếp tục đẩy mạnh phong trào?", "opts": {"A": "Giữ nguyên nội dung hiện có để bảo đảm thống nhất với các đơn vị khác.", "B": "Chỉ bổ sung thêm chỉ tiêu về quân số và vật chất hậu cần.", "C": "Cụ thể hóa nội dung, mục tiêu phong trào thành các chỉ tiêu thiết thực, phù hợp với chức năng, nhiệm vụ và đặc điểm của đơn vị; tổ chức kiểm tra, đánh giá thường xuyên.", "D": "Chỉ cần xác định một chỉ tiêu tổng hợp để thuận lợi khi chấm điểm thi đua."}, "answer": "C"}, {"id": 74, "q": "Trong quá trình thực hiện phong trào, một đơn vị vẫn còn tình trạng sử dụng điện, nước, xăng dầu và vật chất hậu cần chưa tiết kiệm, trong khi công tác tăng gia, cải tiến kỹ thuật và ứng dụng sáng kiến chưa được chú trọng. Nội dung nào cần tập trung chấn chỉnh?", "opts": {"A": "Chỉ tăng cường kiểm kê vật chất hậu cần định kỳ.", "B": "Đẩy mạnh thực hành tiết kiệm, chống lãng phí; phát huy sáng kiến, cải tiến kỹ thuật, ứng dụng khoa học và nâng cao hiệu quả bảo đảm hậu cần.", "C": "Giảm tiêu chuẩn bảo đảm vật chất để tạo nguồn tiết kiệm.", "D": "Chỉ giao cơ quan hậu cần chịu trách nhiệm về các khoản tiêu hao vượt mức."}, "answer": "B"}, {"id": 75, "q": "Khi đánh giá kết quả phong trào thi đua “Ngành Hậu cần Quân đội làm theo lời Bác Hồ dạy”, một đơn vị chỉ căn cứ vào số lượng tập thể, cá nhân được khen thưởng mà chưa đánh giá mức độ chuyển biến thực chất trong công tác hậu cần. Nhận định nào phù hợp nhất?", "opts": {"A": "Cách đánh giá trên là đầy đủ vì số lượng khen thưởng phản ánh trực tiếp chất lượng phong trào.", "B": "Chỉ cần bổ sung thêm số liệu về vật chất, ngân sách đã sử dụng.", "C": "Chưa đầy đủ; kết quả phong trào phải được đánh giá thông qua sự chuyển biến thực chất về nhận thức, trách nhiệm, chất lượng bảo đảm hậu cần, thực hành tiết kiệm, xây dựng chính quy và hiệu quả hoàn thành nhiệm vụ.", "D": "Chỉ cần xem xét thêm kết quả tăng gia sản xuất là đủ."}, "answer": "C"}, {"id": 76, "q": "Qua kiểm tra tại một đơn vị tàu, phát hiện một số quân nhân chưa nắm chắc tiêu chuẩn quân trang được hưởng, việc quản lý, giữ gìn và sử dụng quân trang còn tùy tiện. Theo Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026, chủ thể nào có trách nhiệm giáo dục, phổ biến cho quân nhân thuộc quyền nắm chắc tiêu chuẩn quân trang, nâng cao ý thức trách nhiệm trong quản lý, giữ gìn, bảo quản và sử dụng quân trang?", "opts": {"A": "Cán bộ hậu cần đơn vị.", "B": "Cán bộ chính trị đơn vị.", "C": "Cán bộ, chiến sĩ trong đơn vị.", "D": "Người chỉ huy đơn vị."}, "answer": "D"}, {"id": 77, "q": "Qua kiểm tra công tác quân trang tại một đơn vị tàu, cơ quan cấp trên yêu cầu làm rõ trách nhiệm kiểm tra, nắm chắc số lượng, chất lượng, tình hình quản lý, sử dụng quân trang và thực hiện chế độ báo cáo theo quy định. Theo Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026, trách nhiệm này thuộc về ai?", "opts": {"A": "Cán bộ hậu cần đơn vị.", "B": "Cán bộ, chiến sĩ đơn vị.", "C": "Người chỉ huy đơn vị.", "D": "Cơ quan hậu cần, kỹ thuật cấp trên."}, "answer": "C"}, {"id": 78, "q": "Một đại đội tổ chức kiểm tra quân trang vào đầu tháng 1. Nếu thực hiện đúng phân cấp kiểm tra quân trang đối với Đại đội trưởng và tương đương, thời điểm kiểm tra định kỳ tiếp theo phù hợp nhất là khi nào?", "opts": {"A": "Sau 01 tháng.", "B": "Sau 03 tháng.", "C": "Sau 06 tháng.", "D": "Sau 09 tháng."}, "answer": "B"}, {"id": 79, "q": "Tại một đơn vị tàu, một số quân nhân chưa nắm vững tiêu chuẩn, chế độ quân lương được hưởng và chưa thực hiện tốt việc quản lý, giữ gìn, bảo quản, sử dụng vật chất quân lương. Theo Điều lệnh quản lý bộ đội QĐND Việt Nam năm 2026, chủ thể nào có trách nhiệm tổ chức giáo dục, phổ biến và chấn chỉnh nội dung này?", "opts": {"A": "Cán bộ hậu cần đơn vị.", "B": "Cán bộ, chiến sĩ đơn vị.", "C": "Người chỉ huy đơn vị.", "D": "Cán bộ chính trị đơn vị."}, "answer": "C"}, {"id": 80, "q": "Qua kiểm tra tại một đơn vị tàu, người chỉ huy yêu cầu xác định bộ phận trực tiếp thực hiện việc kiểm tra, nắm chắc số lượng, chất lượng, tình hình quản lý, giữ gìn, bảo quản, sử dụng các loại vật chất quân lương và tổng hợp báo cáo theo quy định. Trách nhiệm này thuộc về ai?", "opts": {"A": "Người chỉ huy đơn vị.", "B": "Cán bộ, chiến sĩ đơn vị.", "C": "Cán bộ hậu cần đơn vị.", "D": "Cơ quan chính trị đơn vị."}, "answer": "C"}, {"id": 81, "q": "Công tác chăm sóc, bảo vệ sức khỏe bộ đội trong đơn vị là trách nhiệm của chủ thể nào?", "opts": {"A": "Lãnh đạo, chỉ huy đơn vị.", "B": "Cán bộ, chiến sĩ ngành Hậu cần.", "C": "Riêng ngành Quân y.", "D": "Thủ trưởng đơn vị phụ trách công tác Quân y."}, "answer": "A"}, {"id": 82, "q": "Phong trào thi đua xây dựng “Đơn vị Quân y 5 tốt” gồm bao nhiêu nội dung?", "opts": {"A": "5 nội dung.", "B": "4 nội dung.", "C": "3 nội dung.", "D": "2 nội dung."}, "answer": "A"}, {"id": 83, "q": "Trong nội dung “Có nếp sống vệ sinh khoa học, bảo đảm quân số khỏe tốt” của Phong trào thi đua xây dựng “Đơn vị Quân y 5 tốt”, yêu cầu đối với chỉ tiêu bảo đảm quân số khỏe của đơn vị là gì?", "opts": {"A": "Đạt 100%.", "B": "Đạt và vượt trên 90%.", "C": "Đạt và vượt chỉ tiêu theo phân cấp quy định.", "D": "Không có trường hợp nào bị bệnh phải nghỉ việc."}, "answer": "C"}, {"id": 84, "q": "Trong nội dung “Quản lý sức khỏe và cấp cứu, điều trị tốt” của Phong trào thi đua xây dựng “Đơn vị Quân y 5 tốt”, chỉ tiêu khám sức khỏe định kỳ hằng năm của đơn vị được xác định như thế nào?", "opts": {"A": "Tổ chức khám sức khỏe định kỳ đạt 100% quân số có mặt tại đơn vị.", "B": "Tổ chức khám sức khỏe định kỳ đạt 99% quân số có mặt tại đơn vị.", "C": "Chỉ tổ chức khám sức khỏe định kỳ cho 100% hạ sĩ quan, binh sĩ.", "D": "Tổ chức khám sức khỏe định kỳ cho trên 2/3 quân số."}, "answer": "A"}, {"id": 85, "q": "Trong công tác phòng ngừa say nắng, say nóng cho bộ đội khi huấn luyện mùa hè, biện pháp nào về tổ chức vận động là phù hợp?", "opts": {"A": "Tổ chức luyện tập liên tục 4–5 giờ dưới trời nắng để nâng cao khả năng chịu đựng.", "B": "Tổ chức luyện tập thích nghi dần với nắng nóng, tăng dần thời gian và cường độ; mỗi mức độ liên tục tối đa không quá 2 giờ.", "C": "Chỉ tổ chức cho bộ đội nghỉ khi xuất hiện quân nhân bị ngất.", "D": "Cho bộ đội mặc trang phục kín, dày trong quá trình luyện tập để tăng khả năng thích nghi."}, "answer": "B"}, {"id": 86, "q": "Trong nội dung “Kết hợp y dược học hiện đại với y dược học cổ truyền tốt” của Phong trào thi đua xây dựng “Đơn vị Quân y 5 tốt”, chỉ tiêu điều trị khỏi bằng thuốc nam, châm cứu của Quân y tàu, Hải đội, Hải đoàn và tương đương là bao nhiêu?", "opts": {"A": "100% tổng số bệnh nhân.", "B": "100% bệnh nhân mắc bệnh mạn tính.", "C": "Không thực hiện điều trị bằng thuốc nam, châm cứu.", "D": "Từ 10–15% tổng số bệnh nhân."}, "answer": "D"}, {"id": 87, "q": "Trong nội dung “Quản lý và sử dụng thuốc, trang thiết bị y tế tốt”, yêu cầu nào sau đây đúng đối với quản lý thuốc?", "opts": {"A": "Cho phép để tối đa 10% thuốc quá hạn trong đơn vị nhưng không đưa vào sử dụng.", "B": "Không để thuốc quá hạn, thuốc giả, thuốc kém phẩm chất trong đơn vị.", "C": "Lập danh sách riêng thuốc giả, thuốc kém phẩm chất để tiếp tục quản lý tại đơn vị.", "D": "Cả ba phương án trên đều đúng."}, "answer": "B"}, {"id": 88, "q": "Trong nội dung “Quản lý và sử dụng thuốc, trang thiết bị y tế tốt”, yêu cầu nào sau đây đúng đối với công tác quản lý máy y tế?", "opts": {"A": "100% máy y tế có lý lịch theo dõi, được bảo quản và định kỳ ghi chép, đánh giá chất lượng.", "B": "Chỉ thực hiện bảo quản thường xuyên đối với máy siêu âm và điện tim.", "C": "Chỉ cần thường xuyên kiểm tra, lau dầu cho máy.", "D": "Cả ba phương án trên đều đúng."}, "answer": "A"}, {"id": 89, "q": "Trong nội dung “Có nếp sống vệ sinh khoa học, bảo đảm quân số khỏe tốt”, yêu cầu nào sau đây phù hợp về bảo vệ môi trường trong đơn vị?", "opts": {"A": "Có kế hoạch cụ thể hằng năm về công tác bảo vệ môi trường là đủ.", "B": "Chỉ tổ chức các biện pháp khử trùng, tẩy uế khi xuất hiện dịch bệnh.", "C": "Xây dựng kế hoạch huấn luyện sẵn sàng chiến đấu cho thương binh, bệnh binh để bảo vệ đơn vị.", "D": "Có kế hoạch và tổ chức triển khai hiệu quả các biện pháp cần thiết xử lý chất thải, bảo vệ môi trường."}, "answer": "D"}, {"id": 90, "q": "Trong nội dung “Quản lý và sử dụng thuốc, trang thiết bị y tế tốt”, yêu cầu nào sau đây đúng đối với cán bộ, nhân viên quân y?", "opts": {"A": "Chỉ bác sĩ phải nắm vững tính năng, công dụng và cách sử dụng thuốc, trang thiết bị y tế.", "B": "100% cán bộ, nhân viên quân y nắm vững tính năng, công dụng, cách sử dụng thuốc, trang thiết bị y tế hiện có trong đơn vị theo phân cấp nhiệm vụ chuyên môn kỹ thuật và sử dụng thành thạo.", "C": "Chỉ 100% y sĩ phải nắm vững và sử dụng thành thạo thuốc, trang thiết bị y tế.", "D": "Chỉ Trưởng ban Quân y phải nắm vững và sử dụng thành thạo thuốc, trang thiết bị y tế."}, "answer": "B"}, {"id": 91, "q": "Một cán bộ được giao nghiên cứu Quy chế số 373-QĐ/ĐU ngày 14/6/2026 về lãnh đạo của Đảng ủy Cảnh sát biển Việt Nam đối với công tác xăng dầu để phục vụ xây dựng kế hoạch triển khai tại đơn vị. Quy chế này được kết cấu gồm bao nhiêu chương?", "opts": {"A": "4 chương.", "B": "5 chương.", "C": "6 chương.", "D": "7 chương."}, "answer": "B"}, {"id": 92, "q": "Khi rà soát toàn bộ nội dung Quy chế số 373-QĐ/ĐU ngày 14/6/2026 về lãnh đạo của Đảng ủy Cảnh sát biển Việt Nam đối với công tác xăng dầu, cán bộ tham mưu cần xác định chính xác số lượng điều của Quy chế. Phương án nào sau đây là đúng?", "opts": {"A": "20 điều.", "B": "21 điều.", "C": "22 điều.", "D": "23 điều."}, "answer": "C"}, {"id": 93, "q": "Trong quá trình tham mưu thực hiện Quy chế số 373-QĐ/ĐU ngày 14/6/2026, một đơn vị cần xác định đúng nội dung Khoản 2 Điều 3 về lãnh đạo công tác xăng dầu. Nội dung nào sau đây phù hợp với quy định?", "opts": {"A": "Lãnh đạo việc lập dự toán, quản lý hạn mức, sử dụng, thanh toán, quyết toán xăng dầu hằng năm và lãnh đạo việc tổ chức thực hiện đúng quy định.", "B": "Lãnh đạo việc quản lý, sử dụng hạn mức, thanh quyết toán xăng dầu, phương tiện kỹ thuật - vật tư xăng dầu hằng năm và việc tổ chức thực hiện theo đúng quy định.", "C": "Lãnh đạo việc quản lý, sử dụng, thanh quyết toán xăng dầu hằng năm và lãnh đạo việc tổ chức thực hiện đúng quy định.", "D": "Lãnh đạo việc xây dựng hạn mức, quản lý, sử dụng, thanh quyết toán xăng dầu và vật tư xăng dầu hằng năm theo phân cấp."}, "answer": "B"}, {"id": 94, "q": "Khi xác định trách nhiệm, quyền hạn của Bí thư Đảng ủy, Chính ủy Cảnh sát biển Việt Nam trong lãnh đạo công tác xăng dầu theo Quy chế số 373-QĐ/ĐU ngày 14/6/2026, nội dung nào sau đây là đúng?", "opts": {"A": "Lãnh đạo việc duy trì chế độ báo cáo công tác xăng dầu với Ban Thường vụ, Đảng ủy Cảnh sát biển Việt Nam theo quy định.", "B": "Lãnh đạo việc duy trì chế độ báo cáo công tác xăng dầu với Ban Thường vụ, Đảng ủy Cảnh sát biển Việt Nam theo quy chế lãnh đạo.", "C": "Lãnh đạo và duy trì thực hiện chế độ báo cáo công tác xăng dầu với Đảng ủy Cảnh sát biển Việt Nam theo quy định.", "D": "Chỉ đạo cơ quan hậu cần, kỹ thuật định kỳ báo cáo công tác xăng dầu với Ban Thường vụ Đảng ủy Cảnh sát biển Việt Nam."}, "answer": "A"}, {"id": 95, "q": "Trong tổ chức thực hiện công tác xăng dầu, Quy chế số 373-QĐ/ĐU ngày 14/6/2026 xác định mối quan hệ giữa Đảng ủy Cảnh sát biển Việt Nam với Hội đồng phân bổ hạn mức xăng dầu và Hội đồng thanh quyết toán xăng dầu/Bộ Tư lệnh Cảnh sát biển là mối quan hệ nào?", "opts": {"A": "Lãnh đạo và phục tùng sự lãnh đạo.", "B": "Lãnh đạo, chỉ huy và phục tùng.", "C": "Chỉ huy và phục tùng sự lãnh đạo.", "D": "Phối hợp công tác và chịu sự chỉ đạo về nghiệp vụ."}, "answer": "A"}, {"id": 96, "q": "Định mức sử dụng nước sạch rửa tàu thuyền; định mức sử dụng điện năng cho sở chỉ huy các cấp, huấn luyện và bảo đảm kỹ thuật cho các chuyên ngành (thông tin, súng pháo, đạn dược, xe - máy, đo lường, tàu thuyền nằm tại bến, trạm xưởng sửa chữa...) hiện được quy định chi tiết tại Thông tư nào của Bộ trưởng Bộ Quốc phòng?", "opts": {"A": "Thông tư số 36/2026/TT-BQP ngày 25/5/2026.", "B": "Thông tư số 51/2026/TT-BQP ngày 16/02/2017.", "C": "Thông tư số 51/2026/TT-BQP ngày 25/5/2026.", "D": "Thông tư số 36/2026/TT-BQP ngày 16/02/2017."}, "answer": "C"}, {"id": 97, "q": "Đối với chỉ huy tiểu đoàn và tương đương; sĩ quan giữ chức vụ có cấp bậc quân hàm cao nhất là Trung tá, Thiếu tá, định mức sử dụng nước sạch trong sinh hoạt là bao nhiêu?", "opts": {"A": "170 - 190 lít/người/ngày.", "B": "200 - 220 lít/người/ngày.", "C": "230 - 250 lít/người/ngày.", "D": "260 - 280 lít/người/ngày."}, "answer": "B"}, {"id": 98, "q": "Định mức sử dụng nước sạch trong sinh hoạt đối với hạ sĩ quan, binh sĩ là bao nhiêu?", "opts": {"A": "140 - 160 lít/người/ngày.", "B": "170 - 190 lít/người/ngày.", "C": "200 - 220 lít/người/ngày.", "D": "230 - 250 lít/người/ngày."}, "answer": "C"}, {"id": 99, "q": "Định mức sử dụng nước sạch rửa Tàu tuần tiễu TT-200 là bao nhiêu?", "opts": {"A": "4.000 lít/lần/tàu.", "B": "3.600 lít/lần/tàu.", "C": "3.000 lít/lần/tàu.", "D": "3.300 lít/lần/tàu."}, "answer": "B"}, {"id": 100, "q": "Định mức điện năng bảo đảm kỹ thuật cho Tàu tuần tiễu TT-400 nằm tại bến là bao nhiêu?", "opts": {"A": "586 kWh/ngày/tàu.", "B": "586 kW/tháng/tàu.", "C": "685 kWh/ngày/tàu.", "D": "568 kWh/ngày/tàu."}, "answer": "A"}];let quiz=[],answers=[],idx=0,mode='practice',wrongIds=[];const $=x=>document.getElementById(x),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function build(q,s){let display=Object.entries(q.opts).map(([key,text])=>({key,text}));if(s)display=shuffle(display);return {...q,display}}function startQuiz(retry){mode=$('mode').value;let pool=retry?BANK.filter(q=>wrongIds.includes(q.id)):BANK,n=retry?pool.length:Math.min(+$('count').value,pool.length);quiz=shuffle(pool).slice(0,n).map(q=>build(q,$('shuffleOpts').checked));answers=Array(n).fill(null);idx=0;$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){let q=quiz[idx];$('progress').textContent=`Câu ${idx+1} / ${quiz.length}`;$('orig').textContent=`Câu gốc ${q.id}`;$('bar').style.width=(idx+1)/quiz.length*100+'%';$('question').textContent=q.q;$('options').innerHTML='';q.display.forEach((it,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+it.text;if(answers[idx]===it.key)b.classList.add('selected');if(mode==='practice'&&answers[idx]){if(it.key===q.answer)b.classList.add('correct');if(it.key===answers[idx]&&it.key!==q.answer)b.classList.add('wrong')}b.onclick=()=>{answers[idx]=it.key;render()};$('options').appendChild(b)});let f=$('feedback');f.innerHTML='';f.className='';if(mode==='practice'&&answers[idx]){let ok=answers[idx]===q.answer,shown=q.display.findIndex(x=>x.key===q.answer);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Chính xác':'✗ Chưa đúng. Đáp án đúng: '+String.fromCharCode(65+shown)}renderNav()}function move(d){idx=Math.max(0,Math.min(quiz.length-1,idx+d));render()}function renderNav(){let n=$('nav');n.innerHTML='';quiz.forEach((q,i)=>{let b=document.createElement('button');b.className='navq'+(answers[i]?' done':'')+(i===idx?' current':'');b.textContent=i+1;b.onclick=()=>{idx=i;render()};n.appendChild(b)})}function submitQuiz(){let correct=0,blank=0;wrongIds=[];quiz.forEach((q,i)=>{if(!answers[i])blank++;else if(answers[i]===q.answer)correct++;else wrongIds.push(q.id)});let pct=Math.round(correct/quiz.length*100);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${correct}/${quiz.length} — ${pct}%`;$('summary').textContent=`Đúng: ${correct} • Sai: ${quiz.length-correct-blank} • Chưa trả lời: ${blank}`;$('retry').disabled=!wrongIds.length;let r=$('review');r.innerHTML='<h2>Xem lại bài</h2>';quiz.forEach((q,i)=>{let d=document.createElement('div'),ans=answers[i],ok=ans===q.answer;d.className='review';d.innerHTML=`<div class="section">Câu ${i+1} • Câu gốc ${q.id} • ${ok?'ĐÚNG':'SAI'}</div><p><b>${esc(q.q)}</b></p><p>Bạn chọn: ${esc(ans?q.opts[ans]:'Chưa trả lời')}</p>${ok?'':`<p><b>Đáp án đúng:</b> ${q.answer}. ${esc(q.opts[q.answer])}</p>`}`;r.appendChild(d)});scrollTo(0,0)}function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}function goHome(){$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('home').classList.remove('hidden');scrollTo(0,0)}</script></body></html>
